<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer SNMP Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-print me-2"></i>
                Printer SNMP Monitor
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <span id="monitoring-status" class="badge bg-secondary">Stopped</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Control Panel -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-cog me-2"></i>Control Panel
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <button id="start-monitoring" class="btn btn-success w-100">
                                    <i class="fas fa-play me-2"></i>Start Monitoring
                                </button>
                            </div>
                            <div class="col-md-6 mb-3">
                                <button id="stop-monitoring" class="btn btn-danger w-100">
                                    <i class="fas fa-stop me-2"></i>Stop Monitoring
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <button id="refresh-all" class="btn btn-info w-100">
                                    <i class="fas fa-sync-alt me-2"></i>Refresh All
                                </button>
                            </div>
                            <div class="col-md-6 mb-3">
                                <button id="add-printer-btn" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#addPrinterModal">
                                    <i class="fas fa-plus me-2"></i>Add Printer
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-info-circle me-2"></i>System Status
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6">
                                <div class="text-center">
                                    <h4 id="printer-count" class="text-primary">0</h4>
                                    <small class="text-muted">Printers</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="text-center">
                                    <h4 id="online-count" class="text-success">0</h4>
                                    <small class="text-muted">Online</small>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <small class="text-muted">
                                Last Update: <span id="last-update">Never</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Printer Grid -->
        <div class="row" id="printer-grid">
            <!-- Printers will be dynamically added here -->
        </div>

        <!-- No Printers Message -->
        <div id="no-printers" class="text-center py-5" style="display: none;">
            <i class="fas fa-print fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">No Printers Added</h4>
            <p class="text-muted">Add your first printer to start monitoring</p>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPrinterModal">
                <i class="fas fa-plus me-2"></i>Add Printer
            </button>
        </div>
    </div>

    <!-- Add Printer Modal -->
    <div class="modal fade" id="addPrinterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Printer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-printer-form">
                        <div class="mb-3">
                            <label for="printer-ip" class="form-label">Printer IP Address</label>
                            <input type="text" class="form-control" id="printer-ip" placeholder="192.168.1.100" required>
                        </div>
                        <div class="mb-3">
                            <label for="printer-community" class="form-label">SNMP Community</label>
                            <input type="text" class="form-control" id="printer-community" value="public" required>
                        </div>
                        <div class="mb-3">
                            <label for="printer-port" class="form-label">SNMP Port</label>
                            <input type="number" class="form-control" id="printer-port" value="161" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="add-printer-submit">
                        <i class="fas fa-plus me-2"></i>Add Printer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Printer Details Modal -->
    <div class="modal fade" id="printerDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="printer-details-title">Printer Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="printer-details-body">
                    <!-- Printer details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <!-- Toasts will be dynamically added here -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
