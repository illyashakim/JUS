<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Printer Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Printer Monitor</h1>
      <table class="table table-bordered" id="printers-table">
        <thead>
          <tr>
            <th>IP</th>
            <th>Description</th>
            <th>Status</th>
            <th>Toner %</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
      <button class="btn btn-primary" id="refresh-btn">Refresh</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/main.js"></script>
  </body>
</html>
